name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - uses: actions/checkout@v7
        with:
          repository: lailai0916/lailai-template
          ref: 44bf94b5718ba605cdd7e240ed2e47b4b53f7500
          path: .repository-standards
          persist-credentials: false
      - name: Validate repository standards
        run: python3 scripts/validate-standards.py .repository-standards/scripts/check_repository.py

  publish:
    needs: validate
    if: >-
      github.repository == 'lailai0916/ui' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm release status
        id: release
        run: node scripts/check-release.mjs
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - name: Publish to npm with OIDC
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --registry=https://registry.npmjs.org

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create matching tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          npm view "@lailai0916/ui@$version" --json > "$RUNNER_TEMP/npm-release.json"
          target="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/npm-release.json", "utf8")).gitHead')"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; skipping."
            exit 0
          fi
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const notes = changelog.split(`## ${version}\n`)[1]?.split('\n## ')[0].trim();
          if (!notes) throw new Error(`Missing changelog for ${version}`);
          writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, notes + '\n');
          JS
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target" \
            --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
